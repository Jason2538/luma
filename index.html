<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Luma</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230e0e10'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%23ffd9a0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e0e10; --fg:#f4f1ec; --dim:rgba(244,241,236,.62); --faint:rgba(244,241,236,.14);
  --accent:#ffd9a0; --green:#1db954;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.ic{width:24px;height:24px;fill:currentColor;display:block}
[hidden]{display:none!important}

/* ---------- 배경 ---------- */
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60vmax 40vmax at 15% 10%,rgba(255,200,130,.16),transparent 60%),
   radial-gradient(50vmax 40vmax at 90% 90%,rgba(120,150,255,.12),transparent 60%);}
#coverBg{position:fixed;inset:-10%;z-index:0;background-size:cover;background-position:center;
  filter:blur(70px) saturate(1.5) brightness(.55);opacity:0;transition:opacity .8s;transform:scale(1.2)}
body.has-cover #coverBg{opacity:1}

/* ---------- 상단바 ---------- */
.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 22px 14px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:5px;box-shadow:0 0 14px var(--accent)}
.user{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
.user img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--faint)}
.user button{padding:7px 12px;border-radius:999px;background:var(--faint);font-size:13px}

/* ---------- 홈 ---------- */
main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 22px calc(120px + env(safe-area-inset-bottom))}
.hero{min-height:34vh;display:flex;align-items:center;justify-content:center;text-align:center;transition:min-height .5s}
body.compact .hero{min-height:11vh}
#phrase{font-size:clamp(28px,5.4vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.25;
  transition:opacity .6s ease,transform .6s ease,filter .6s ease;min-height:2.6em;display:flex;align-items:center;justify-content:center}
body.compact #phrase{font-size:clamp(20px,3vw,30px);min-height:1.4em}
#phrase.out{opacity:0;transform:translateY(10px);filter:blur(8px)}
#phrase.en{font-weight:700;letter-spacing:-.025em}

.box{margin:0 auto;max-width:640px}
.login{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px}
.btn-green{background:var(--green);color:#04120a;font-weight:700;padding:15px 30px;border-radius:999px;font-size:16px}
.btn-green:active{transform:scale(.97)}
.hint{font-size:13px;color:var(--dim);text-align:center;line-height:1.6;max-width:480px}
.setup{background:rgba(255,255,255,.06);border:1px solid var(--faint);border-radius:var(--radius);padding:18px;margin:16px auto;max-width:640px;font-size:14px;line-height:1.7}
.setup h3{font-size:15px;margin-bottom:8px}
.setup code{display:block;word-break:break-all;background:rgba(0,0,0,.35);padding:9px 11px;border-radius:9px;margin:6px 0 10px;font-size:13px;user-select:all}
.setup .row{display:flex;gap:8px}
.setup input{flex:1;min-width:0;padding:11px 13px;border-radius:10px;border:1px solid var(--faint);background:rgba(0,0,0,.35)}
.setup .row button{padding:0 18px;border-radius:10px;background:var(--accent);color:#2a1d05;font-weight:700}
.setup .mini{padding:6px 12px;border-radius:8px;background:var(--faint);font-size:12px}

.search{position:relative;margin-top:8px}
.search .ic{position:absolute;z-index:1;pointer-events:none;left:18px;top:50%;transform:translateY(-50%);color:var(--dim);width:22px;height:22px}
.search input{width:100%;padding:17px 20px 17px 52px;border-radius:999px;border:1px solid var(--faint);
  background:rgba(255,255,255,.08);font-size:17px;outline:none;backdrop-filter:blur(10px)}
.search input:focus{border-color:rgba(255,217,160,.6);background:rgba(255,255,255,.12)}
.search input::placeholder{color:var(--dim)}

h2.sec{font-size:20px;font-weight:700;margin:30px 0 14px;letter-spacing:-.02em}
.artists{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.artist{flex:0 0 auto;width:104px;text-align:center}
.artist img,.artist .ph{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--faint);display:block;margin-bottom:8px}
.artist span{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tracks{display:flex;flex-direction:column}
.trk{display:grid;grid-template-columns:48px 1fr minmax(0,.7fr) 48px;gap:14px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left;width:100%}
.trk:hover,.trk:focus-visible{background:rgba(255,255,255,.08)}
.trk.on{background:rgba(255,217,160,.12)}
.trk img,.trk .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--faint)}
.trk .t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .a{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.trk .al{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .d{font-size:13px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.more{display:block;margin:14px auto 0;padding:11px 26px;border-radius:999px;background:var(--faint);font-size:14px}
.empty{color:var(--dim);text-align:center;padding:30px 0;font-size:14px;line-height:1.7}

.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.pl{text-align:left;padding:10px;border-radius:14px;transition:background .2s}
.pl:hover{background:rgba(255,255,255,.07)}
.pl img,.pl .ph{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:var(--faint);margin-bottom:10px;display:grid;place-items:center;color:var(--dim)}
.pl .n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .c{font-size:12px;color:var(--dim);margin-top:2px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:14px;margin:22px 0 4px;padding:6px 4px}
.plhead{display:flex;gap:18px;align-items:center;margin:8px 0 18px}
.plhead img,.plhead .ph{width:110px;height:110px;border-radius:12px;object-fit:cover;background:var(--faint)}
.plhead h2{font-size:26px;letter-spacing:-.02em}
.plhead p{font-size:13px;color:var(--dim);margin-top:4px}
.playall{margin-top:12px;background:var(--accent);color:#2a1d05;font-weight:700;padding:10px 22px;border-radius:999px;font-size:14px}

/* ---------- 미니바 ---------- */
#miniBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;
  width:min(560px,calc(100% - 28px));display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:18px;
  background:rgba(40,38,36,.78);backdrop-filter:blur(18px);border:1px solid var(--faint);cursor:pointer;text-align:left}
#miniBar img{width:44px;height:44px;border-radius:8px;object-fit:cover}
#miniBar .m{flex:1;min-width:0}
#miniBar .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniBar .a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniBar .pp{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:#111}
#miniBar .bar{position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--faint);border-radius:2px;overflow:hidden}
#miniBar .bar i{display:block;height:100%;width:0;background:var(--accent)}

/* ---------- 플레이어 (전체 화면) ---------- */
#player{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(300px,34vw) 1fr;gap:clamp(24px,6vw,110px);
  align-items:center;padding:0 clamp(24px,6vw,100px);padding-top:env(safe-area-inset-top);
  transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);background:#15130f;overflow:hidden}
#player.open{transform:none}
#pBg{position:absolute;inset:-15%;background-size:cover;background-position:center;filter:blur(80px) saturate(1.6) brightness(.62);transform:scale(1.15);transition:background-image .6s}
#pShade{position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.18),rgba(0,0,0,.08) 55%,rgba(0,0,0,.22))}
#closeP{position:absolute;top:calc(22px + env(safe-area-inset-top));left:24px;z-index:3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
#closeP:hover{background:rgba(255,255,255,.12);color:#fff}
#devBtn{position:absolute;top:calc(22px + env(safe-area-inset-top));right:24px;z-index:3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
#devBtn:hover{background:rgba(255,255,255,.12);color:#fff}
#devMenu{position:absolute;top:calc(72px + env(safe-area-inset-top));right:24px;z-index:4;min-width:230px;max-width:80vw;background:rgba(30,28,26,.92);backdrop-filter:blur(18px);border:1px solid var(--faint);border-radius:14px;padding:8px}
#devMenu h4{font-size:12px;color:var(--dim);padding:8px 10px;font-weight:600}
#devMenu button{display:block;width:100%;text-align:left;padding:10px;border-radius:9px;font-size:14px}
#devMenu button:hover{background:rgba(255,255,255,.1)}
#devMenu button.cur{color:var(--accent)}

.pl-left{position:relative;z-index:2;width:100%;max-width:520px;justify-self:end}
#cover{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.1);
  box-shadow:0 30px 70px rgba(0,0,0,.45);display:block;transition:transform .4s}
.meta{display:flex;align-items:center;gap:12px;margin-top:18px}
.meta .txt{flex:1;min-width:0}
.meta .tt{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .aa{font-size:16px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prog{margin-top:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,rgba(255,255,255,.92) var(--p),rgba(255,255,255,.28) var(--p))}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:rgba(255,255,255,.92)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 1px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:clamp(18px,3.4vw,40px);margin-top:14px}
.ctrls button{color:var(--fg);opacity:.92;position:relative}
.ctrls button:active{transform:scale(.92)}
.ctrls .ic.big{width:62px;height:62px}
.ctrls .ic.mid{width:40px;height:40px}
.ctrls .tog{opacity:.5}
.ctrls .tog.on{opacity:1;color:var(--accent)}
.ctrls .badge{position:absolute;right:-2px;top:-3px;font-size:10px;font-weight:800;color:var(--accent)}
.vol{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--dim)}
.vol .ic{width:18px;height:18px;flex:none}
#state{font-size:12px;color:var(--dim);text-align:center;margin-top:10px;min-height:1.4em}

.pl-right{position:relative;z-index:2;height:100%;min-width:0}
#lyrics{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:44vh 4vw 44vh 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
#lyrics.msg{padding:0;overflow:hidden;-webkit-mask-image:none;mask-image:none}
.ln{font-size:clamp(26px,3.3vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.28;margin:0 0 .62em;cursor:pointer;
  opacity:.34;filter:blur(calc(var(--d,4) * 1.3px));transition:opacity .45s,filter .45s,transform .45s;transform-origin:left center;transform:scale(.97)}
.ln.act{opacity:1;filter:none;transform:scale(1)}
.ln[data-d="1"]{opacity:.5}
.ln[data-d="2"]{opacity:.4}
.ln:hover{filter:none;opacity:.85}
.ln.gap{opacity:.4;letter-spacing:.3em}
#lyrics.plain .ln{filter:none;opacity:.85;cursor:default;font-size:clamp(20px,2.2vw,30px);font-weight:700;transform:none}
.lmsg{height:100%;display:grid;place-items:center;color:var(--dim);font-size:16px;text-align:center;line-height:1.7;padding:0 6vw 0 0}
.lsrc{position:absolute;right:14px;bottom:14px;font-size:11px;color:var(--dim);opacity:.7}

/* 좁은 화면 / 세로 화면: 위아래로 쌓기 */
@media (max-width:900px),(orientation:portrait){
  #player{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-items:stretch;gap:10px;padding:calc(68px + env(safe-area-inset-top)) 20px 0}
  .pl-left{max-width:none;justify-self:stretch;align-self:start;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;min-width:0}
  #cover{width:min(44vw,34vh);grid-row:1 / span 2;border-radius:12px}
  .meta{margin:0;align-self:end}
  .prog,.ctrls,.vol,#state{grid-column:1 / -1}
  .prog{margin-top:6px}
  .ctrls .ic.big{width:54px;height:54px}
  .vol{display:none}
  #lyrics{padding:24vh 0 30vh;}
  .ln{font-size:clamp(22px,6vw,32px)}
  .lmsg{padding:0}
  .pl-right{height:auto;min-height:0}
  .lsrc{bottom:8px}
  .trk{grid-template-columns:48px 1fr 44px}
  .trk .al{display:none}
}
@media (max-width:900px) and (orientation:landscape){
  #player{grid-template-columns:minmax(240px,40vw) 1fr;grid-template-rows:none;align-items:center;padding:0 20px;gap:24px}
  .pl-left{display:block;align-self:center}
  #cover{width:min(100%,38vh)}
  .meta{margin-top:10px}
  .pl-right{height:100%}
  #lyrics{padding:44vh 0}
}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:100;
  background:rgba(250,246,240,.96);color:#1a1814;padding:11px 18px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:26px;height:26px;border:3px solid var(--faint);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18.3 5.71L12 12.01 5.7 5.71 4.29 7.12l6.3 6.29-6.3 6.3 1.41 1.41 6.3-6.3 6.29 6.3 1.42-1.41-6.3-6.3 6.3-6.29z"/></symbol>
  <symbol id="i-dev" viewBox="0 0 24 24"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></symbol>
</svg>

<div id="glow"></div>
<div id="coverBg"></div>

<header class="topbar">
  <div class="brand">Luma<i></i></div>
  <div class="user" id="userBox" hidden>
    <img id="userImg" alt="">
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</header>

<main>
  <section class="hero"><h1 id="phrase" lang="ko">&nbsp;</h1></section>

  <!-- 처음 한 번만: Client ID 입력 -->
  <section class="setup" id="setup" hidden>
    <h3>처음 설정</h3>
    <p>Spotify 개발자 대시보드의 앱 설정에서 아래 주소를 <b>Redirect URI</b>에 그대로 추가해 주세요.</p>
    <code id="redirectShow"></code>
    <p>그리고 앱의 <b>Client ID</b>를 붙여넣으세요. (Client Secret은 필요 없어요)</p>
    <div class="row" style="margin-top:8px">
      <input id="cidInput" placeholder="Client ID" autocomplete="off" spellcheck="false">
      <button id="cidSave">저장</button>
    </div>
  </section>

  <section class="login box" id="loginBox" hidden>
    <button class="btn-green" id="loginBtn">Spotify로 로그인</button>
    <p class="hint" id="loginHint">로그인하면 노래 검색과 내 플레이리스트를 쓸 수 있어요.<br>재생은 Spotify Premium 계정이 필요해요.</p>
    <button class="mini hint" id="resetCid" style="text-decoration:underline" hidden>Client ID 다시 입력</button>
  </section>

  <div id="appBody" hidden>
    <div class="search box" style="max-width:720px">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="노래나 가수를 검색해 보세요" autocomplete="off" spellcheck="false">
    </div>

    <div id="results" hidden></div>
    <div id="plDetail" hidden></div>
    <section id="plSec"></section>
  </div>
</main>

<button id="miniBar" hidden aria-label="플레이어 열기">
  <img id="miniImg" alt="">

<div id="toast"></div>
<script>
/* =====================================================================
   Luma — Spotify 웹 플레이어 (서버 없이 GitHub Pages에서 동작)
   ▶ 아래 CLIENT_ID 에 Spotify 앱의 Client ID 를 넣어 주세요.
     (비워 두면 화면에서 직접 입력할 수 있어요. Client Secret 은 쓰지 않아요.)
   ===================================================================== */
const LUMA_CONFIG = {
  CLIENT_ID: ''
};

(() => {
'use strict';

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { ms = Math.max(0, Math.floor(ms / 1000)); return Math.floor(ms / 60) + ':' + String(ms % 60).padStart(2, '0'); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
let toastT;
function toast(msg, ms = 4200){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- 처음 화면: 5초마다 바뀌는 문구 (한국어 ↔ 영어) ---------- */
const KO = [
  '당신은 무슨 노래를 듣고 싶나요?',
  '지금 마음이 머무는 노래는 어떤 곡인가요?',
  '오늘 하루를 채워 줄 한 곡, 무엇일까요?',
  '듣고 싶은 노래를 살며시 들려주세요.'
];
const EN = [
  'What are you in the mood to hear?',
  'Which song is calling your name right now?',
  'Go on — what should we play?',
  'Name a song, and let the music begin.'
];
function startPhrases(){
  const el = $('phrase'); let n = 0;
  const show = () => {
    const i = Math.floor(n / 2) % KO.length, ko = n % 2 === 0;
    el.lang = ko ? 'ko' : 'en';
    el.classList.toggle('en', !ko);
    el.textContent = ko ? KO[i] : EN[i];
    n++;
  };
  show();
  setInterval(() => {
    el.classList.add('out');
    setTimeout(() => { show(); el.classList.remove('out'); }, 600);
  }, 5000);
}

/* ---------- Spotify 로그인 (PKCE, 서버·Secret 불필요) ---------- */
const AUTH_URL = 'https://accounts.spotify.com/authorize';
const TOKEN_URL = 'https://accounts.spotify.com/api/token';
const API = 'https://api.spotify.com/v1';
const SCOPES = [
  'streaming', 'user-read-email', 'user-read-private',
  'user-read-playback-state', 'user-modify-playback-state',
  'playlist-read-private', 'playlist-read-collaborative', 'user-library-read'
].join(' ');

const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');
const cidFromConfig = () => (LUMA_CONFIG.CLIENT_ID || '').trim();
const getCid = () => cidFromConfig() || (LS.get('luma_cid') || '').trim();

const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64u(a).slice(0, n); };

let tok = null;
try { tok = JSON.parse(LS.get('luma_tok') || 'null'); } catch { tok = null; }
function saveTok(j){
  tok = { access: j.access_token, refresh: j.refresh_token || tok?.refresh, exp: Date.now() + (j.expires_in || 3600) * 1000 };
  LS.set('luma_tok', JSON.stringify(tok));
}
async function tokenReq(params){
  const r = await fetch(TOKEN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(params)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error_description || j.error || 'token error'), { status: r.status });
  return j;
}
let refreshing = null;
async function getToken(force){
  if (!tok) throw new Error('로그인이 필요해요');
  if (!force && Date.now() < tok.exp - 60000) return tok.access;
  if (!refreshing) {
    refreshing = tokenReq({ grant_type: 'refresh_token', refresh_token: tok.refresh, client_id: getCid() })
      .then(j => { saveTok(j); return tok.access; })
      .catch(e => { if (e.status === 400 || e.status === 401) { forgetTokens(); } throw e; })
      .finally(() => { refreshing = null; });
  }
  return refreshing;
}
function forgetTokens(){ tok = null; LS.del('luma_tok'); }

async function login(showDialog){
  if (!window.crypto || !crypto.subtle) { toast('https 주소(또는 127.0.0.1)에서만 로그인할 수 있어요'); return; }
  const v = rand(64), state = rand(16);
  const challenge = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  LS.set('luma_v', v); LS.set('luma_state', state);
  const p = new URLSearchParams({
    client_id: getCid(), response_type: 'code', redirect_uri: redirectUri(), scope: SCOPES,
    state, code_challenge_method: 'S256', code_challenge: challenge
  });
  if (showDialog) p.set('show_dialog', 'true');
  location.href = AUTH_URL + '?' + p;
}
async function handleCallback(){
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), err = q.get('error'), st = q.get('state');
  history.replaceState(null, '', redirectUri());
  if (err) { toast('로그인이 취소됐어요'); return false; }
  if (!code || st !== LS.get('luma_state')) { toast('로그인 정보가 맞지 않아요. 다시 시도해 주세요'); return false; }
  try {
    const j = await tokenReq({
      grant_type: 'authorization_code', code, redirect_uri: redirectUri(),
      client_id: getCid(), code_verifier: LS.get('luma_v')
    });
    saveTok(j); LS.del('luma_v'); LS.del('luma_state');
    return true;
  } catch (e) { toast('로그인 실패: ' + e.message); return false; }
}
function logout(){
  forgetTokens();
  try { player && player.disconnect(); } catch {}
  location.href = redirectUri();
}

/* ---------- Spotify API 호출 ---------- */
async function api(path, { method = 'GET', body, retry = true } = {}){
  const t = await getToken();
  const r = await fetch(path.startsWith('http') ? path : API + path, {
    method,
    headers: { Authorization: 'Bearer ' + t, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401 && retry) { await getToken(true); return api(path, { method, body, retry: false }); }
  if (r.status === 429 && retry) { await sleep(Math.min(+r.headers.get('Retry-After') || 1, 8) * 1000); return api(path, { method, body, retry: false }); }
  if (r.status === 204) return null;
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) {
    const e = new Error(j?.error?.message || ('HTTP ' + r.status));
    e.status = r.status; e.reason = j?.error?.reason; throw e;
  }
  return j;
}

/* ---------- 데이터 정리 ---------- */
function pickImg(imgs, min = 0){
  if (!imgs || !imgs.length) return '';
  const s = [...imgs].sort((a, b) => (a.width || 9999) - (b.width || 9999));
  return (s.find(i => (i.width || 9999) >= min) || s[s.length - 1]).url;
}
const bigImg = imgs => (imgs && imgs.length) ? [...imgs].sort((a, b) => (b.width || 0) - (a.width || 0))[0].url : '';
function normTrack(t){
  return {
    id: t.id, uri: t.uri, name: t.name,
    artists: (t.artists || []).map(a => a.name),
    album: t.album?.name || '',
    thumb: pickImg(t.album?.images, 64), cover: bigImg(t.album?.images),
    dur: t.duration_ms || 0
  };
}
const rowHTML = (t, i) =>
  `<button class="trk" data-i="${i}" data-uri="${esc(t.uri)}">` +
  (t.thumb ? `<img src="${esc(t.thumb)}" alt="" loading="lazy">` : '<div class="ph"></div>') +
  `<div style="min-width:0"><div class="t">${esc(t.name)}</div><div class="a">${esc(t.artists.join(', '))}</div></div>` +
  `<div class="al">${esc(t.album)}</div><div class="d">${fmt(t.dur)}</div></button>`;
function markPlaying(){
  const u = S.track?.uri;
  document.querySelectorAll('.trk').forEach(r => r.classList.toggle('on', !!u && r.dataset.uri === u));
}

/* ---------- 가사 (LRCLIB: 무료, 키 불필요) ---------- */
function parseLRC(txt){
  const out = [];
  for (const raw of String(txt).split(/\r?\n/)) {
    const re = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
    const times = []; let m, last = 0;
    while ((m = re.exec(raw))) {
      times.push(+m[1] * 60000 + +m[2] * 1000 + (m[3] ? Math.round(+('0.' + m[3]) * 1000) : 0));
      last = re.lastIndex;
    }
    if (!times.length) continue;
    const s = raw.slice(last).trim();
    times.forEach(t => out.push({ t, s }));
  }
  return out.sort((a, b) => a.t - b.t);
}
function cleanTitle(s){
  const c = String(s)
    .replace(/\s*[\(\[][^\)\]]*(feat|ft\.|with|remaster|live|version|edit|mono|stereo|deluxe|bonus)[^\)\]]*[\)\]]/ig, '')
    .replace(/\s+-\s+.*(remaster|live|version|edit|mono|stereo|single|radio).*$/i, '')
    .trim();
  return c || String(s);
}
async function lrc(path, params){
  const r = await fetch('https://lrclib.net/api/' + path + '?' + new URLSearchParams(params));
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('lrclib ' + r.status);
  return r.json();
}
async function fetchLyrics(t){
  const artist = t.artists[0] || '', title = cleanTitle(t.name), dur = Math.round(t.dur / 1000);
  let hit = null;
  try {
    hit = await lrc('get', { track_name: t.name, artist_name: artist, album_name: t.album, duration: dur });
  } catch {}
  if (!hit || (!hit.syncedLyrics && !hit.plainLyrics && !hit.instrumental)) {
    let list = await lrc('search', { track_name: title, artist_name: artist }) || [];
    if (!list.length) list = await lrc('search', { q: (title + ' ' + artist).trim() }) || [];
    const cand = list
      .filter(x => x.syncedLyrics || x.plainLyrics || x.instrumental)
      .map(x => ({ x, sc: Math.abs((x.duration || 0) - dur) + (x.syncedLyrics ? 0 : 3) }))
      .sort((a, b) => a.sc - b.sc);
    hit = cand.length && cand[0].sc <= 10 ? cand[0].x : null;
  }
  if (!hit) return null;
  if (hit.instrumental && !hit.syncedLyrics && !hit.plainLyrics) return { instr: true };
  return {
    synced: hit.syncedLyrics ? parseLRC(hit.syncedLyrics) : null,
    plain: hit.plainLyrics || ''
  };
}

const LY = { seq: 0, lines: null, els: [], idx: -2 };
const lyCache = new Map();
let userScrollUntil = 0;
function setLyMsg(html){
  const el = $('lyrics'); el.className = 'msg';
  el.innerHTML = `<div class="lmsg">${html}</div>`;
  $('lsrc').textContent = ''; LY.lines = null; LY.els = [];
}
async function loadLyrics(track){
  const seq = ++LY.seq; LY.idx = -2;
  setLyMsg('가사를 찾는 중…');
  let res = lyCache.get(track.id);
  if (res === undefined) {
    try { res = await fetchLyrics(track); lyCache.set(track.id, res); }
    catch { res = 'err'; }
  }
  if (seq !== LY.seq) return;
  const el = $('lyrics');
  if (res === 'err') return setLyMsg('가사를 불러오지 못했어요.<br>네트워크를 확인해 주세요.');
  if (!res) return setLyMsg('이 곡의 가사를 찾지 못했어요');
  if (res.instr) return setLyMsg('♪ 연주곡이에요');
  if (res.synced && res.synced.length) {
    LY.lines = res.synced;
    el.className = '';
    el.innerHTML = res.synced.map((l, i) =>
      `<p class="ln${l.s ? '' : ' gap'}" data-i="${i}">${l.s ? esc(l.s) : '♪'}</p>`).join('');
    LY.els = [...el.children];
    el.scrollTop = 0; LY.idx = -2;
    $('lsrc').textContent = '가사 · LRCLIB';
    updateLyrics(curPos(), true);
  } else if (res.plain) {
    el.className = 'plain';
    el.innerHTML = res.plain.split(/\r?\n/).map(s => `<p class="ln">${s.trim() ? esc(s) : '&nbsp;'}</p>`).join('');
    el.scrollTop = 0; LY.lines = null; LY.els = [];
    $('lsrc').textContent = '시간 정보 없는 가사 · LRCLIB';
  } else setLyMsg('이 곡의 가사를 찾지 못했어요');
}
function updateLyrics(p, jump){
  if (!LY.lines) return;
  const L = LY.lines; let lo = 0, hi = L.length - 1, idx = -1;
  const pos = p + 150;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (L[mid].t <= pos) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
  if (idx === LY.idx && !jump) return;
  LY.idx = idx;
  const ref = Math.max(idx, 0);
  LY.els.forEach((el, i) => {
    const d = Math.abs(i - ref);
    el.style.setProperty('--d', Math.min(d, 5));
    el.dataset.d = d;
    el.classList.toggle('act', i === idx);
  });
  scrollToLine(ref, !jump);
}
function scrollToLine(i, smooth){
  if (Date.now() < userScrollUntil) return;
  const ly = $('lyrics'), el = LY.els[i];
  if (!el) return;
  ly.scrollTo({ top: el.offsetTop - ly.clientHeight * 0.34, behavior: smooth ? 'smooth' : 'auto' });
}

/* ---------- 재생 상태 ---------- */
const S = {
  track: null, paused: true, pos: 0, ts: 0, dur: 0,
  shuffle: false, repeat: 0, vol: Math.min(100, Math.max(0, +(LS.get('luma_vol') || 60))),
  dev: '', devId: null, web: false
};
let player = null, deviceId = null, pickedDevice = null, dragging = false, volDrag = false;
const devWaiters = [];

function curPos(){
  if (!S.track) return 0;
  const p = S.paused ? S.pos : S.pos + (performance.now() - S.ts);
  return Math.min(Math.max(p, 0), S.dur || p);
}
function setPos(ms, paused){ S.pos = ms; S.ts = performance.now(); if (paused !== undefined) S.paused = paused; }

function applyTrack(tr){
  if (!tr) return;
  const changed = !S.track || S.track.uri !== tr.uri;
  S.track = tr; S.dur = tr.dur || S.dur;
  if (changed) renderTrack();
}
function renderTrack(){
  const t = S.track;
  const cover = t.cover || t.thumb;
  $('cover').src = cover || '';
  $('pTitle').textContent = t.name;
  $('pArtist').textContent = t.artists.join(', ');
  $('pBg').style.backgroundImage = cover ? `url("${cover}")` : '';
  $('coverBg').style.backgroundImage = cover ? `url("${cover}")` : '';
  document.body.classList.toggle('has-cover', !!cover);
  $('miniImg').src = t.thumb || cover || '';
  $('miniT').textContent = t.name;
  $('miniA').textContent = t.artists.join(', ');
  $('miniBar').hidden = false;
  document.title = `${t.name} · Luma`;
  loadLyrics(t);
  markPlaying();
}
function syncUI(){
  const icon = S.paused ? '#i-play' : '#i-pause';
  $('icPlay').firstElementChild.setAttribute('href', icon);
  $('miniPP').firstElementChild.firstElementChild.setAttribute('href', icon);
  $('bShuf').classList.toggle('on', !!S.shuffle);
  $('bRep').classList.toggle('on', S.repeat > 0);
  $('repBadge').hidden = S.repeat !== 2;
  if (!volDrag) { $('vol').value = S.vol; $('vol').style.setProperty('--p', S.vol + '%'); }
  $('state').textContent = S.dev ? `${S.dev}에서 재생` : '';
}
function applySdkState(st){
  const c = st.track_window && st.track_window.current_track;
  if (!c) return;
  S.web = true; S.devId = deviceId; S.dev = '이 브라우저';
  setPos(st.position || 0, !!st.paused);
  S.shuffle = !!st.shuffle; S.repeat = st.repeat_mode || 0;
  applyTrack({
    id: c.id, uri: c.uri, name: c.name,
    artists: (c.artists || []).map(a => a.name), album: c.album?.name || '',
    thumb: pickImg(c.album?.images, 64), cover: bigImg(c.album?.images),
    dur: st.duration || c.duration_ms || 0
  });
  S.dur = st.duration || S.dur;
  syncUI();
}
async function pollRemote(){
  try {
    const j = await api('/me/player');
    if (!j || !j.device) return;
    if (j.device.id === deviceId) { S.web = true; return; }
    S.web = false; S.devId = j.device.id; S.dev = j.device.name;
    if (typeof j.device.volume_percent === 'number') S.vol = j.device.volume_percent;
    if (j.item && j.item.type === 'track') {
      setPos(j.progress_ms || 0, !j.is_playing);
      S.shuffle = !!j.shuffle_state;
      S.repeat = { off: 0, context: 1, track: 2 }[j.repeat_state] || 0;
      applyTrack(normTrack(j.item));
      syncUI();
    }
  } catch {}
}

/* ---------- Web Playback SDK ---------- */
function initSDK(){
  window.onSpotifyWebPlaybackSDKReady = () => {
    player = new Spotify.Player({
      name: 'Luma 웹 플레이어',
      getOAuthToken: cb => { getToken().then(cb).catch(() => {}); },
      volume: S.vol / 100
    });
    player.addListener('ready', ({ device_id }) => {
      deviceId = device_id;
      devWaiters.splice(0).forEach(f => f(device_id));
    });
    player.addListener('player_state_changed', st => {
      if (!st) { S.web = false; return; }
      applySdkState(st);
    });
    player.addListener('account_error', () => toast('웹에서 재생하려면 Spotify Premium 계정이 필요해요'));
    player.addListener('authentication_error', () => toast('Spotify 인증에 문제가 생겼어요. 다시 로그인해 주세요'));
    player.addListener('initialization_error', () =>
      toast('이 브라우저는 웹 재생을 지원하지 않아요. 오른쪽 위 기기 버튼에서 Spotify 앱을 골라 조작할 수 있어요', 6500));
    player.connect();
  };
  const s = document.createElement('script');
  s.src = 'https://sdk.scdn.co/spotify-player.js'; s.async = true;
  document.head.appendChild(s);
}
function waitDevice(ms){
  if (deviceId) return Promise.resolve(deviceId);
  return new Promise(res => { devWaiters.push(res); setTimeout(() => res(deviceId), ms); });
}
const listDevices = async () => (await api('/me/player/devices')).devices || [];

function handleErr(e){
  if (e.reason === 'PREMIUM_REQUIRED' || /premium/i.test(e.message)) return toast('재생은 Spotify Premium 계정에서만 가능해요');
  if (e.status === 404) return toast('재생할 기기를 찾지 못했어요');
  if (e.status === 403) return toast('Spotify에서 이 동작을 허용하지 않았어요: ' + e.message);
  toast(e.message || '문제가 생겼어요');
}

async function startPlayback(body, hint){
  player && player.activateElement && player.activateElement();
  let dev = pickedDevice || deviceId;
  if (!dev) dev = await waitDevice(4000);
  if (!dev) {
    try { const ds = await listDevices(); dev = (ds.find(d => d.is_active) || ds[0] || {}).id; } catch {}
  }
  if (!dev) {
    toast('재생할 기기가 없어요. 이 브라우저가 웹 재생을 지원하지 않으면 Spotify 앱을 켠 뒤, 플레이어 오른쪽 위 기기 버튼에서 골라 주세요.', 7000);
    return;
  }
  const go = () => api('/me/player/play?device_id=' + encodeURIComponent(dev), { method: 'PUT', body });
  try { await go(); }
  catch (e) {
    if (e.status !== 404) return handleErr(e);
    try {
      await api('/me/player', { method: 'PUT', body: { device_ids: [dev], play: false } });
      await sleep(700); await go();
    } catch (e2) { return handleErr(e2); }
  }
  S.devId = dev; S.web = dev === deviceId;
  if (!S.web) { setTimeout(pollRemote, 900); setTimeout(pollRemote, 2500); }
  if (hint) { setPos(0, false); applyTrack(hint); syncUI(); }
  openPlayer();
}
function playList(list, i){
  const from = Math.max(0, i - 50), slice = list.slice(from, from + 100);
  startPlayback({ uris: slice.map(t => t.uri), offset: { position: i - from } }, list[i]);
}

/* ---------- 재생 컨트롤 ---------- */
const withDev = p => S.devId ? p + (p.includes('?') ? '&' : '?') + 'device_id=' + encodeURIComponent(S.devId) : p;
const afterRemote = () => { if (!S.web) setTimeout(pollRemote, 700); };
async function togglePlay(){
  if (!S.track) return;
  player && player.activateElement && player.activateElement();
  setPos(curPos(), !S.paused); syncUI();
  try {
    if (S.web && player) await player.togglePlay();
    else { await api(withDev(S.paused ? '/me/player/pause' : '/me/player/play'), { method: 'PUT' }); afterRemote(); }
  } catch (e) { handleErr(e); }
}
async function skip(dir){
  if (!S.track) return;
  try {
    if (S.web && player) await (dir > 0 ? player.nextTrack() : player.previousTrack());
    else { await api(withDev(dir > 0 ? '/me/player/next' : '/me/player/previous'), { method: 'POST' }); afterRemote(); }
  } catch (e) { handleErr(e); }
}
async function seekTo(ms){
  if (!S.track) return;
  ms = Math.max(0, Math.min(ms, S.dur - 300));
  setPos(ms);
  try {
    if (S.web && player) await player.seek(ms);
    else await api(withDev('/me/player/seek?position_ms=' + Math.round(ms)), { method: 'PUT' });
  } catch (e) { handleErr(e); }
}
let volT;
function setVolume(v){
  S.vol = v; LS.set('luma_vol', String(v));
  if (S.web && player) { player.setVolume(v / 100).catch(() => {}); return; }
  clearTimeout(volT);
  volT = setTimeout(() => { api(withDev('/me/player/volume?volume_percent=' + v), { method: 'PUT' }).catch(() => {}); }, 250);
}
async function toggleShuffle(){
  if (!S.track) return;
  S.shuffle = !S.shuffle; syncUI();
  try { await api(withDev('/me/player/shuffle?state=' + S.shuffle), { method: 'PUT' }); } catch (e) { S.shuffle = !S.shuffle; syncUI(); handleErr(e); }
}
async function cycleRepeat(){
  if (!S.track) return;
  const prev = S.repeat; S.repeat = (S.repeat + 1) % 3; syncUI();
  try { await api(withDev('/me/player/repeat?state=' + ['off', 'context', 'track'][S.repeat]), { method: 'PUT' }); }
  catch (e) { S.repeat = prev; syncUI(); handleErr(e); }
}

/* ---------- 플레이어 화면 열고 닫기 ---------- */
function openPlayer(){
  if (!S.track) return;
  $('player').classList.add('open'); document.body.style.overflow = 'hidden';
  LY.idx = -2; updateLyrics(curPos(), true);
}
function closePlayer(){
  $('player').classList.remove('open'); $('devMenu').hidden = true; document.body.style.overflow = '';
}

/* 화면 갱신 루프 (진행바 · 가사) */
let lastSec = -1;
function loop(){
  requestAnimationFrame(loop);
  if (!S.track) return;
  const p = curPos(), pct = S.dur ? p / S.dur : 0;
  $('miniBarFill').style.width = (pct * 100) + '%';
  if (!$('player').classList.contains('open')) return;
  if (!dragging) {
    const seek = $('seek');
    seek.value = Math.round(pct * 1000);
    seek.style.setProperty('--p', (pct * 100) + '%');
    const sec = Math.floor(p / 1000);
    if (sec !== lastSec) { lastSec = sec; $('tCur').textContent = fmt(p); $('tLeft').textContent = '-' + fmt(S.dur - p); }
  }
  updateLyrics(p);
}

/* ---------- 검색 ---------- */
let sSeq = 0, sQ = '', sTracks = [], sArtists = [], sOffset = 0, sMore = false;
function resetHome(){
  $('results').hidden = true; $('results').innerHTML = '';
  $('plDetail').hidden = true; detail = null;
  $('plSec').hidden = false;
  document.body.classList.remove('compact');
}
async function doSearch(q){
  q = q.trim(); const seq = ++sSeq;
  if (!q) { sQ = ''; resetHome(); return; }
  document.body.classList.add('compact');
  $('plSec').hidden = true; $('plDetail').hidden = true; detail = null;
  $('results').hidden = false; $('results').innerHTML = '<div class="spin"></div>';
  try {
    const j = await api('/search?' + new URLSearchParams({ q, type: 'track,artist', limit: 10 }));
    if (seq !== sSeq) return;
    sQ = q;
    sTracks = (j.tracks?.items || []).filter(Boolean).map(normTrack);
    sArtists = (j.artists?.items || []).filter(Boolean);
    sOffset = 10; sMore = !!j.tracks?.next;
    renderResults();
  } catch (e) {
    if (seq !== sSeq) return;
    $('results').innerHTML = `<div class="empty">검색하지 못했어요<br>${esc(e.message)}</div>`;
  }
}
function renderResults(){
  let h = '';
  if (sArtists.length) {
    h += '<h2 class="sec">아티스트</h2><div class="artists">' + sArtists.map((a, i) =>
      `<button class="artist" data-a="${i}">${pickImg(a.images, 160) ? `<img src="${esc(pickImg(a.images, 160))}" alt="" loading="lazy">` : '<div class="ph"></div>'}<span>${esc(a.name)}</span></button>`).join('') + '</div>';
  }
  h += '<h2 class="sec">곡</h2>';
  h += sTracks.length
    ? '<div class="tracks">' + sTracks.map(rowHTML).join('') + '</div>' + (sMore ? '<button class="more" id="moreBtn">더 보기</button>' : '')
    : '<div class="empty">검색 결과가 없어요</div>';
  $('results').innerHTML = h;
  markPlaying();
}
async function searchMore(){
  const btn = $('moreBtn'); if (btn) btn.textContent = '불러오는 중…';
  const seq = sSeq;
  try {
    const j = await api('/search?' + new URLSearchParams({ q: sQ, type: 'track', limit: 10, offset: sOffset }));
    if (seq !== sSeq) return;
    sTracks.push(...(j.tracks?.items || []).filter(Boolean).map(normTrack));
    sOffset += 10; sMore = !!j.tracks?.next;
    renderResults();
  } catch (e) { toast(e.message); if (btn) btn.textContent = '더 보기'; }
}

/* ---------- 상세 화면 (아티스트 · 플레이리스트 · 좋아요) ---------- */
let detail = null;
async function openDetail(opts){
  const me = detail = { tracks: [], offset: 0, hasMore: false, ...opts };
  $('results').hidden = true; $('plSec').hidden = true;
  const d = $('plDetail'); d.hidden = false;
  d.innerHTML =
    `<button class="back" id="backBtn"><svg class="ic" style="width:20px;height:20px"><use href="#i-back"/></svg>뒤로</button>` +
    `<div class="plhead">${opts.img ? `<img src="${esc(opts.img)}" alt="">` : '<div class="ph"></div>'}` +
    `<div><h2>${esc(opts.title)}</h2><p>${esc(opts.sub || '')}</p>${opts.playAll ? '<button class="playall" id="playAllBtn">전체 재생</button>' : ''}</div></div>` +
    `<div class="tracks" id="dTracks"><div class="spin"></div></div><div id="dMore"></div>`;
  window.scrollTo({ top: 0 });
  await detailMore(me);
}
async function detailMore(me){
  try {
    const r = await me.loadPage(me.offset);
    if (detail !== me) return;
    me.tracks.push(...r.tracks); me.offset = r.nextOffset; me.hasMore = r.hasMore;
    $('dTracks').innerHTML = me.tracks.length ? me.tracks.map(rowHTML).join('') : '<div class="empty">곡이 없어요</div>';
    $('dMore').innerHTML = me.hasMore ? '<button class="more" id="dMoreBtn">더 보기</button>' : '';
    markPlaying();
  } catch (e) {
    if (detail !== me) return;
    $('dTracks').innerHTML = `<div class="empty">${esc((me.errMsg && me.errMsg(e)) || e.message || '불러오지 못했어요')}</div>`;
    $('dMore').innerHTML = '';
  }
}
function backFromDetail(){
  detail = null; $('plDetail').hidden = true;
  if (sQ && $('q').value.trim()) { $('results').hidden = false; }
  else { $('plSec').hidden = false; document.body.classList.remove('compact'); }
}
function openArtist(a){
  const q = `artist:"${a.name.replace(/"/g, '')}"`;
  openDetail({
    title: a.name, sub: '아티스트', img: pickImg(a.images, 200),
    loadPage: async off => {
      const j = await api('/search?' + new URLSearchParams({ q, type: 'track', limit: 10, offset: off }));
      return { tracks: (j.tracks?.items || []).filter(Boolean).map(normTrack), nextOffset: off + 10, hasMore: !!j.tracks?.next };
    },
    play(i){ playList(detail.tracks, i); },
    playAll: true, playAllFn(){ if (detail.tracks.length) playList(detail.tracks, 0); }
  });
}
let me = null;
function openPlaylist(p){
  const total = p.items?.total ?? p.tracks?.total;
  openDetail({
    title: p.name, sub: (total != null ? total + '곡 · ' : '') + (p.owner?.display_name || ''), img: pickImg(p.images, 200),
    loadPage: async off => {
      const j = await api(`/playlists/${p.id}/items?limit=50&offset=${off}`);
      const its = (j.items || []).map(e => e && (e.item || e.track)).filter(t => t && t.type === 'track' && !t.is_local && t.uri);
      return { tracks: its.map(normTrack), nextOffset: off + (j.items || []).length, hasMore: !!j.next };
    },
    errMsg: e => e.status === 403
      ? 'Spotify 정책상 내가 만들지 않은 플레이리스트는 곡 목록을 불러올 수 없어요. 위의 "전체 재생"으로는 들을 수 있어요.'
      : null,
    play(i){ startPlayback({ context_uri: p.uri, offset: { uri: detail.tracks[i].uri } }, detail.tracks[i]); },
    playAll: true, playAllFn(){ startPlayback({ context_uri: p.uri }); }
  });
}
function openLiked(){
  openDetail({
    title: '좋아요 표시한 곡', sub: '내 라이브러리', img: '',
    loadPage: async off => {
      const j = await api(`/me/tracks?limit=50&offset=${off}`);
      const its = (j.items || []).map(e => e && (e.track || e.item)).filter(t => t && t.uri && !t.is_local);
      return { tracks: its.map(normTrack), nextOffset: off + (j.items || []).length, hasMore: !!j.next };
    },
    play(i){ playList(detail.tracks, i); },
    playAll: true, playAllFn(){ if (detail.tracks.length) playList(detail.tracks, 0); }
  });
}

/* ---------- 내 플레이리스트 ---------- */
let myPlaylists = [], hasLiked = false;
async function loadPlaylists(){
  const sec = $('plSec');
  sec.innerHTML = '<h2 class="sec">내 플레이리스트</h2><div class="spin"></div>';
  let items = [], url = '/me/playlists?limit=50';
  try {
    for (let i = 0; i < 10 && url; i++) {
      const j = await api(url);
      items.push(...(j.items || []).filter(Boolean)); url = j.next;
    }
  } catch (e) {
    sec.innerHTML = `<h2 class="sec">내 플레이리스트</h2><div class="empty">플레이리스트를 불러오지 못했어요<br>${esc(e.message)}</div>`;
    return;
  }
  try { await api('/me/tracks?limit=1'); hasLiked = true; } catch { hasLiked = false; }
  const mine = p => p.owner?.id === me?.id || p.collaborative;
  myPlaylists = items.sort((a, b) => (mine(b) ? 1 : 0) - (mine(a) ? 1 : 0));
  let h = '<h2 class="sec">내 플레이리스트</h2><div class="pls">';
  if (hasLiked) h += `<button class="pl" data-liked="1"><div class="ph"><svg class="ic" style="width:40px;height:40px"><use href="#i-note"/></svg></div><div class="n">좋아요 표시한 곡</div><div class="c">내 라이브러리</div></button>`;
  h += myPlaylists.map((p, i) => {
    const img = pickImg(p.images, 300), total = p.items?.total ?? p.tracks?.total;
    return `<button class="pl" data-p="${i}">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : '<div class="ph"><svg class="ic" style="width:40px;height:40px"><use href="#i-note"/></svg></div>'}` +
      `<div class="n">${esc(p.name)}</div><div class="c">${total != null ? total + '곡' : ''}${mine(p) ? '' : ' · 저장한 목록'}</div></button>`;
  }).join('') + '</div>';
  if (!items.length && !hasLiked) h = '<h2 class="sec">내 플레이리스트</h2><div class="empty">아직 플레이리스트가 없어요</div>';
  sec.innerHTML = h;
}

/* ---------- 기기 선택 (Spotify Connect) ---------- */
async function openDevMenu(){
  const m = $('devMenu');
  if (!m.hidden) { m.hidden = true; return; }
  m.hidden = false;
  m.innerHTML = '<h4>재생 기기</h4><div class="spin" style="width:20px;height:20px;margin:14px auto"></div>';
  try {
    const ds = await listDevices();
    m.innerHTML = '<h4>재생 기기</h4>' + (ds.length
      ? ds.map(d => `<button data-id="${esc(d.id)}" class="${d.id === S.devId ? 'cur' : ''}">${esc(d.name)}${d.id === deviceId ? ' (이 브라우저)' : ''}</button>`).join('')
      : '<h4>사용할 수 있는 기기가 없어요.<br>Spotify 앱을 켠 뒤 다시 열어 보세요.</h4>');
  } catch (e) { m.innerHTML = `<h4>기기를 불러오지 못했어요<br>${esc(e.message)}</h4>`; }
}
async function pickDevice(id){
  $('devMenu').hidden = true;
  pickedDevice = id;
  try {
    await api('/me/player', { method: 'PUT', body: { device_ids: [id], play: !!S.track && !S.paused } });
    S.devId = id; S.web = id === deviceId;
    if (!S.web) { setTimeout(pollRemote, 900); setTimeout(pollRemote, 2500); }
  } catch (e) { handleErr(e); }
}

/* ---------- 시작 ---------- */
function showSetup(){
  $('setup').hidden = false;
  $('redirectShow').textContent = redirectUri();
  if (location.hostname === 'localhost') {
    $('redirectShow').insertAdjacentHTML('afterend', '<p style="color:#ffb4a0">⚠ Spotify는 localhost 주소를 받지 않아요. 주소창의 localhost 를 127.0.0.1 로 바꿔서 열어 주세요.</p>');
  }
}
function showBlocked(){
  $('appBody').hidden = true; $('loginBox').hidden = false;
  $('loginHint').innerHTML = '이 계정은 아직 사용할 수 없어요.<br>Spotify 개발 모드 앱은 개발자 대시보드의 <b>User Management</b>에 등록한 계정(최대 5명)만 쓸 수 있어요.';
  $('loginBtn').textContent = '다른 계정으로 로그인';
  $('loginBtn').onclick = () => { forgetTokens(); login(true); };
  $('userBox').hidden = false; $('userName').textContent = ''; $('userImg').hidden = true;
}
async function startApp(){
  $('loginBox').hidden = true; $('setup').hidden = true;
  $('appBody').hidden = false; $('userBox').hidden = false;
  try { me = await api('/me'); }
  catch (e) {
    if (e.status === 403) return showBlocked();
    if (e.status === 401 || !tok) { logout(); return; }
    toast('Spotify에 연결하지 못했어요: ' + e.message);
  }
  if (me) {
    $('userName').textContent = me.display_name || me.id;
    const im = pickImg(me.images, 64);
    if (im) $('userImg').src = im; else $('userImg').hidden = true;
  }
  initSDK();
  loadPlaylists();
  pollRemote();
  setInterval(() => { if (tok && !document.hidden && !S.web) pollRemote(); }, 3500);
}

function bind(){
  /* 로그인 · 설정 */
  $('loginBtn').onclick = () => login(false);
  $('logoutBtn').onclick = logout;
  $('cidSave').onclick = () => {
    const v = $('cidInput').value.trim();
    if (!/^[0-9a-f]{32}$/i.test(v)) { toast('Client ID는 영문·숫자 32자리예요. 다시 확인해 주세요'); return; }
    LS.set('luma_cid', v); location.reload();
  };
  $('resetCid').onclick = () => { LS.del('luma_cid'); forgetTokens(); location.reload(); };

  /* 검색 */
  let dt;
  $('q').addEventListener('input', e => { clearTimeout(dt); dt = setTimeout(() => doSearch(e.target.value), 380); });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(dt); e.target.blur(); doSearch(e.target.value); } });
  $('results').addEventListener('click', e => {
    const row = e.target.closest('.trk'); if (row) return playList(sTracks, +row.dataset.i);
    const art = e.target.closest('.artist'); if (art) return openArtist(sArtists[+art.dataset.a]);
    if (e.target.closest('#moreBtn')) searchMore();
  });
  $('plDetail').addEventListener('click', e => {
    if (e.target.closest('#backBtn')) return backFromDetail();
    if (e.target.closest('#playAllBtn')) return detail && detail.playAllFn && detail.playAllFn();
    if (e.target.closest('#dMoreBtn')) { const b = $('dMoreBtn'); b.textContent = '불러오는 중…'; return detailMore(detail); }
    const row = e.target.closest('.trk'); if (row && detail) detail.play(+row.dataset.i);
  });
  $('plSec').addEventListener('click', e => {
    const c = e.target.closest('.pl'); if (!c) return;
    if (c.dataset.liked) openLiked(); else openPlaylist(myPlaylists[+c.dataset.p]);
  });

  /* 플레이어 */
  $('miniBar').onclick = openPlayer;
  $('miniPP').onclick = e => { e.stopPropagation(); togglePlay(); };
  $('closeP').onclick = closePlayer;
  $('bPlay').onclick = togglePlay;
  $('bNext').onclick = () => skip(1);
  $('bPrev').onclick = () => { if (curPos() > 4000) seekTo(0); else skip(-1); };
  $('bShuf').onclick = toggleShuffle;
  $('bRep').onclick = cycleRepeat;
  const seek = $('seek');
  seek.addEventListener('input', () => {
    dragging = true;
    const ms = seek.value / 1000 * S.dur;
    seek.style.setProperty('--p', (seek.value / 10) + '%');
    $('tCur').textContent = fmt(ms); $('tLeft').textContent = '-' + fmt(S.dur - ms);
  });
  seek.addEventListener('change', () => { seekTo(seek.value / 1000 * S.dur); dragging = false; });
  const vol = $('vol');
  vol.addEventListener('input', () => { volDrag = true; vol.style.setProperty('--p', vol.value + '%'); setVolume(+vol.value); });
  vol.addEventListener('change', () => { volDrag = false; });
  $('devBtn').onclick = e => { e.stopPropagation(); openDevMenu(); };
  $('devMenu').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) pickDevice(b.dataset.id); });
  document.addEventListener('click', e => { if (!e.target.closest('#devMenu') && !e.target.closest('#devBtn')) $('devMenu').hidden = true; });

  /* 가사: 줄을 누르면 그 위치로 이동, 직접 스크롤하면 잠시 자동 스크롤 멈춤 */
  const ly = $('lyrics');
  ly.addEventListener('click', e => {
    const p = e.target.closest('.ln'); if (!p || !LY.lines) return;
    userScrollUntil = 0; seekTo(LY.lines[+p.dataset.i].t);
  });
  ['wheel', 'touchstart', 'pointerdown'].forEach(ev => ly.addEventListener(ev, () => { userScrollUntil = Date.now() + 3500; }, { passive: true }));

  /* 키보드 */
  document.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'range') return;
    const open = $('player').classList.contains('open');
    if (e.key === 'Escape' && open) closePlayer();
    else if (open && e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (open && e.key === 'ArrowRight') seekTo(curPos() + 5000);
    else if (open && e.key === 'ArrowLeft') seekTo(curPos() - 5000);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && tok && !S.web) pollRemote(); });
}

async function init(){
  startPhrases();
  bind();
  syncUI();
  requestAnimationFrame(loop);

  const cid = getCid();
  if (!cid) { showSetup(); return; }
  if (!cidFromConfig()) $('resetCid').hidden = false;

  const qs = new URLSearchParams(location.search);
  if (qs.has('code') || qs.has('error')) await handleCallback();

  if (tok) startApp();
  else $('loginBox').hidden = false;
}

window.LumaTest = { parseLRC, cleanTitle };
init();
})();
</script>
</body>
</html>
